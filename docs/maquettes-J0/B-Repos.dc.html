<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B — Repos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF7A47}
</style>
</helmet>
<div style="{{ fond }}">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="{{ pisteStyle }}"><div style="{{ barreStyle }}"></div></div>
    <div style="display: flex; justify-content: space-between">
      <span style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em">{{ titre }}</span>
      <span style="font-size: 12px; font-weight: 600; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.12em">Démo : 20 s</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 190px; font-weight: 800; line-height: 0.8; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{ temps }}</span>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; opacity: 0.75">
      <svg width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><circle cx="9" cy="10" r="7"></circle><line x1="9" y1="10" x2="9" y2="6"></line></svg>
      <span>Minuteur iPhone lancé</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <div style="{{ suivantStyle }}">
      <span style="font-size: 11px; font-weight: 700; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.12em">Ensuite · série 3 sur 4</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 800; line-height: 1; text-transform: uppercase">Squat arrière · 80 kg × 5</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button onClick="{{ plus30 }}" style="{{ btnStyle }}">+30 s</button>
      <a href="B-Seance.dc.html" style="{{ passerStyle }}">{{ passerTexte }}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { restant: 20, total: 20 }; }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (self.state.restant > 0) { self.setState({ restant: self.state.restant - 1 }); }
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var self = this;
    var r = this.state.restant, tot = this.state.total;
    var fini = r === 0;
    var ink = fini ? '#0B0B0B' : '#F2F0EA';
    var m = Math.floor(r / 60), s = r % 60;
    var pct = tot ? (1 - r / tot) * 100 : 100;
    var cond = 'font-family: Barlow Condensed, sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase; ';
    return {
      temps: fini ? 'GO' : m + ':' + (s < 10 ? '0' : '') + s,
      titre: fini ? 'Repos terminé' : 'Repos',
      fond: 'width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 34px 20px; display: flex; flex-direction: column; justify-content: space-between; font-family: Inter, system-ui, sans-serif; transition: background 300ms ease; color: ' + ink + '; background: ' + (fini ? '#FF5A1F' : '#0B0B0B'),
      pisteStyle: 'height: 8px; background: ' + (fini ? 'rgba(0,0,0,0.2)' : '#262626'),
      barreStyle: 'height: 8px; transition: width 900ms linear; width: ' + pct.toFixed(1) + '%; background: ' + (fini ? '#0B0B0B' : '#FF5A1F'),
      suivantStyle: 'display: flex; flex-direction: column; gap: 4px; padding-top: 12px; border-top: 1px solid ' + (fini ? 'rgba(0,0,0,0.3)' : '#262626'),
      btnStyle: cond + 'height: 60px; border-radius: 4px; background: transparent; color: ' + ink + '; border: 1px solid ' + (fini ? '#0B0B0B' : '#3A3A3A'),
      passerStyle: cond + 'display: flex; align-items: center; justify-content: center; height: 60px; border-radius: 4px; text-decoration: none; ' + (fini ? 'background: #0B0B0B; color: #FF5A1F' : 'background: #F2F0EA; color: #0B0B0B'),
      passerTexte: fini ? 'Série suivante' : 'Passer',
      plus30: function () { self.setState({ restant: self.state.restant + 30, total: Math.max(self.state.total, self.state.restant + 30) }); }
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>A — Aujourd'hui</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF7A47}
input[type=range]{accent-color:#FF5A1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 56px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 600; color: #98989F; text-transform: uppercase; letter-spacing: 0.04em">Lundi 28 décembre</span>
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Aujourd'hui</h1>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{ lieux }}" as="l" hint-placeholder-count="3">
        <button onClick="{{ l.pick }}" style="{{ l.style }}">{{ l.label }}</button>
      </sc-for>
    </div>

    <div style="background: #141416; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 13px; font-weight: 600; color: #98989F">Séance A · Reprise, semaine 1</span>
      <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15">Explosivité et force du bas du corps</span>
      <div style="display: flex; gap: 16px; align-items: baseline">
        <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em">{{ duree }}<span style="font-size: 15px; font-weight: 600; color: #98989F"> min</span></span>
        <span style="font-size: 32px; font-weight: 800; letter-spacing: -0.02em">{{ nbEx }}<span style="font-size: 15px; font-weight: 600; color: #98989F"> exercices</span></span>
      </div>
      <sc-if value="{{ modifie }}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 14px; color: #FF5A1F; font-weight: 600">{{ modifTexte }}</span>
      </sc-if>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #98989F; font-weight: 600">
        <span>Temps disponible · {{ temps }} min</span>
        <input type="range" min="20" max="90" step="5" value="{{ temps }}" onChange="{{ onTemps }}" style="width: 100%">
      </label>
      <a href="A-Seance.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #FF5A1F; color: #000000; font-size: 18px; font-weight: 700; text-decoration: none">Commencer</a>
    </div>

    <div style="background: #141416; border-radius: 22px; padding: 16px 18px; display: flex; gap: 18px; align-items: center">
      <svg width="112" height="112" role="img" aria-label="Anneaux du jour" style="transform: rotate(-90deg); flex-shrink: 0">
        <circle cx="56" cy="56" r="50" style="fill: none; stroke: #3A1A0E; stroke-width: 11px"></circle>
        <circle cx="56" cy="56" r="50" style="{{ ring1 }}"></circle>
        <circle cx="56" cy="56" r="36" style="fill: none; stroke: #2C2C2E; stroke-width: 11px"></circle>
        <circle cx="56" cy="56" r="36" style="{{ ring2 }}"></circle>
        <circle cx="56" cy="56" r="22" style="fill: none; stroke: #1F2A33; stroke-width: 11px"></circle>
        <circle cx="56" cy="56" r="22" style="{{ ring3 }}"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #98989F">
        <span><span style="color: #FF5A1F; font-size: 20px; font-weight: 800">1 420</span> / 2 680 kcal</span>
        <span><span style="color: #F5F5F7; font-size: 20px; font-weight: 800">96</span> / 164 g protéines</span>
        <span><span style="color: #7CC4FF; font-size: 20px; font-weight: 800">1</span> / 4 séances</span>
      </div>
    </div>

    <div style="background: #141416; border-radius: 18px; padding: 12px 14px 12px 18px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #98989F; font-weight: 600">Pesée · tendance 7 jours</span>
        <span style="font-size: 20px; font-weight: 800">82,1 kg</span>
      </div>
      <button style="height: 44px; padding: 0 18px; border-radius: 14px; border: none; background: #2C2C2E; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700">Peser</button>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: #0E0E10; border-top: 1px solid #1F1F22; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FF5A1F; text-decoration: none; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px; stroke-linecap: round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg>Aujourd'hui</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6E73; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px; stroke-linecap: round"><rect x="3" y="5" width="18" height="16" rx="3"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="3" x2="8" y2="7"></line><line x1="16" y1="3" x2="16" y2="7"></line></svg>Programme</span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6E73; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px; stroke-linecap: round"><polyline points="3,18 9,12 13,15 21,6"></polyline></svg>Progrès</span>
    <a href="A-Nutrition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6E73; text-decoration: none; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px; stroke-linecap: round"><path d="M12 21c-5 0-8-4-8-9 0-4 3-6 6-6 1 0 2 .5 2 .5S13 6 14 6c3 0 6 2 6 6 0 5-3 9-8 9z"></path><path d="M12 6c0-2 1-3 3-4"></path></svg>Nutrition</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #6E6E73; font-size: 10px; font-weight: 600">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px; stroke-linecap: round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>Profil</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lieu: 'salle', temps: 60 }; }
  ring(r, pct, color) {
    var c = 2 * Math.PI * r;
    return 'fill: none; stroke: ' + color + '; stroke-width: 11px; stroke-linecap: round; stroke-dasharray: ' + c.toFixed(1) + '; stroke-dashoffset: ' + (c * (1 - pct)).toFixed(1);
  }
  renderVals() {
    var self = this;
    var lieu = this.state.lieu;
    var t = this.state.temps;
    var base = 'height: 44px; border-radius: 14px; border: none; font-family: Inter, system-ui, sans-serif; font-size: 15px; font-weight: 700; ';
    var lieux = [['salle', 'Salle'], ['maison', 'Maison'], ['dehors', 'Extérieur']].map(function (p) {
      var on = p[0] === lieu;
      return { label: p[1], pick: function () { self.setState({ lieu: p[0] }); },
        style: base + (on ? 'background: #FF5A1F; color: #000000' : 'background: #1C1C1E; color: #F5F5F7') };
    });
    var nb = t >= 60 ? 6 : t >= 45 ? 5 : t >= 35 ? 4 : 3;
    var modifs = { salle: '', maison: '3 exercices remplacés · Voir pourquoi', dehors: '2 exercices remplacés · Voir pourquoi' }[lieu];
    if (t < 60) { modifs = (modifs ? modifs + ' · ' : '') + (6 - nb) + ' retiré' + (6 - nb > 1 ? 's' : '') + ' (temps)'; }
    return {
      lieux: lieux, temps: t, duree: Math.min(58, t), nbEx: nb,
      modifie: !!modifs, modifTexte: modifs,
      onTemps: function (e) { self.setState({ temps: Number(e.target.value) }); },
      ring1: this.ring(50, 0.53, '#FF5A1F'), ring2: this.ring(36, 0.59, '#F5F5F7'), ring3: this.ring(22, 0.25, '#7CC4FF')
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B — Mode séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF7A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; padding: 50px 20px 34px 20px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="B-Aujourdhui.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; border: 1px solid #262626; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #F2F0EA">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2px"><line x1="5" y1="5" x2="17" y2="17"></line><line x1="17" y1="5" x2="5" y2="17"></line></svg></a>
    <span style="font-size: 12px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Exercice 02 / 06 · 14:32</span>
    <button aria-label="Options de l'exercice" style="width: 44px; height: 44px; border: 1px solid #262626; border-radius: 4px; background: transparent; color: #F2F0EA; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" aria-hidden="true" style="fill: currentColor"><rect x="3" y="10" width="3" height="3"></rect><rect x="10" y="10" width="3" height="3"></rect><rect x="17" y="10" width="3" height="3"></rect></svg></button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px">
    <div style="height: 4px; background: #F2F0EA"></div><div style="height: 4px; background: #FF5A1F"></div><div style="height: 4px; background: #262626"></div><div style="height: 4px; background: #262626"></div><div style="height: 4px; background: #262626"></div><div style="height: 4px; background: #262626"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 600; color: #FF5A1F; text-transform: uppercase; letter-spacing: 0.12em">Série 2 sur 4 · Force</span>
    <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 60px; font-weight: 800; line-height: 0.9; text-transform: uppercase">Squat arrière</h1>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #262626; border-bottom: 1px solid #262626">
    <div style="padding: 14px 0; border-right: 1px solid #262626; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Charge · kg</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 112px; font-weight: 800; line-height: 0.85">{{ charge }}</span>
      <div style="display: flex; gap: 6px">
        <button onClick="{{ moinsC }}" aria-label="Moins 2,5 kg" style="width: 56px; height: 44px; border-radius: 4px; border: 1px solid #262626; background: transparent; color: #F2F0EA; font-size: 22px; font-weight: 600">−</button>
        <button onClick="{{ plusC }}" aria-label="Plus 2,5 kg" style="width: 56px; height: 44px; border-radius: 4px; border: 1px solid #262626; background: transparent; color: #F2F0EA; font-size: 22px; font-weight: 600">+</button>
      </div>
    </div>
    <div style="padding: 14px 0 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Répétitions · obj. 5</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 112px; font-weight: 800; line-height: 0.85">{{ reps }}</span>
      <div style="display: flex; gap: 6px">
        <button onClick="{{ moinsR }}" aria-label="Une répétition de moins" style="width: 56px; height: 44px; border-radius: 4px; border: 1px solid #262626; background: transparent; color: #F2F0EA; font-size: 22px; font-weight: 600">−</button>
        <button onClick="{{ plusR }}" aria-label="Une répétition de plus" style="width: 56px; height: 44px; border-radius: 4px; border: 1px solid #262626; background: transparent; color: #F2F0EA; font-size: 22px; font-weight: 600">+</button>
      </div>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Dernière fois · J−5</span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 700">77,5 kg × 5 / 5 / 5</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #262626">
    <button style="height: 48px; border: none; border-right: 1px solid #262626; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase">Remplacer</button>
    <button style="height: 48px; border: none; border-right: 1px solid #262626; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase">Fiche</button>
    <button style="height: 48px; border: none; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase">Note</button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="B-Repos.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 68px; padding: 0 22px; border-radius: 4px; background: #FF5A1F; color: #0B0B0B; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; text-transform: uppercase; text-decoration: none">Valider la série
    <svg width="30" height="30" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 3px; stroke-linecap: square"><polyline points="5,15 12,22 25,8"></polyline></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { charge: 80, reps: 5 }; }
  renderVals() {
    var self = this;
    var c = this.state.charge, r = this.state.reps;
    return {
      charge: String(c).replace('.', ','), reps: r,
      plusC: function () { self.setState({ charge: c + 2.5 }); },
      moinsC: function () { self.setState({ charge: Math.max(0, c - 2.5) }); },
      plusR: function () { self.setState({ reps: r + 1 }); },
      moinsR: function () { self.setState({ reps: Math.max(0, r - 1) }); }
    };
  }
}
</script>
</body>
</html>

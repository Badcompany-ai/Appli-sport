<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B — Nutrition</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF7A47}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #262626; padding-bottom: 10px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 800; line-height: 0.9; text-transform: uppercase">Nutrition</h1>
      <span style="font-size: 12px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em; padding-bottom: 4px">Sèche lente</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Kcal restantes</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 800; line-height: 0.9">1 260</span>
        <div style="height: 6px; background: #262626"><div style="width: 53%; height: 6px; background: #FF5A1F"></div></div>
        <span style="font-size: 12px; font-weight: 600; color: #8A877F">1 420 / 2 680 · plafond</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Protéines à prendre</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 64px; font-weight: 800; line-height: 0.9">68 g</span>
        <div style="height: 6px; background: #262626"><div style="width: 59%; height: 6px; background: #F2F0EA"></div></div>
        <span style="font-size: 12px; font-weight: 600; color: #8A877F">96 / 164 g · minimum</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #262626; border-bottom: 1px solid #262626">
      <div style="padding: 8px 0; border-right: 1px solid #262626; display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">48 / 74 g</span><span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Lipides</span></div>
      <div style="padding: 8px 0 8px 10px; border-right: 1px solid #262626; display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">160 / 338 g</span><span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Glucides</span></div>
      <div style="padding: 8px 0 8px 10px; display: flex; flex-direction: column"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700">14 / 30 g</span><span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Fibres</span></div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button style="height: 52px; border-radius: 4px; border: none; background: #FF5A1F; color: #0B0B0B; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase">Scanner</button>
      <button style="height: 52px; border-radius: 4px; border: 1px solid #F2F0EA; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 800; text-transform: uppercase">Chercher</button>
    </div>
    <div style="display: flex; gap: 16px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em">
      <button style="background: none; border: none; padding: 6px 0; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; text-decoration: underline">Récents</button>
      <button style="background: none; border: none; padding: 6px 0; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; text-decoration: underline">Favoris</button>
      <button style="background: none; border: none; padding: 6px 0; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; text-decoration: underline">Copier hier</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{ aliments }}" as="a" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: 48px 1fr auto; gap: 8px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid #1E1E1E">
          <span style="font-size: 12px; font-weight: 600; color: #8A877F; font-variant-numeric: tabular-nums">{{ a.heure }}</span>
          <div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 600">{{ a.nom }}</span><span style="font-size: 11px; color: #8A877F">{{ a.prot }} g protéines</span></div>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">{{ a.kcal }}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: #0B0B0B; border-top: 1px solid #262626; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 10px; box-sizing: border-box">
    <a href="B-Aujourdhui.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; text-decoration: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><rect x="3" y="3" width="16" height="16"></rect><rect x="8" y="8" width="6" height="6" style="fill: currentColor"></rect></svg>Jour</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><rect x="3" y="4" width="16" height="15"></rect><line x1="3" y1="9" x2="19" y2="9"></line></svg>Programme</span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><line x1="5" y1="19" x2="5" y2="12"></line><line x1="11" y1="19" x2="11" y2="7"></line><line x1="17" y1="19" x2="17" y2="3"></line></svg>Progrès</span>
    <a href="B-Nutrition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #F2F0EA; text-decoration: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><circle cx="11" cy="12" r="7"></circle><line x1="11" y1="5" x2="11" y2="2"></line></svg>Nutrition</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><circle cx="11" cy="7" r="4"></circle><path d="M3 20c1-4 4-6 8-6s7 2 8 6"></path></svg>Profil</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      aliments: [
        { nom: 'Skyr nature, 250 g', heure: '07:40', prot: 25, kcal: '155' },
        { nom: 'Tartines et carré frais', heure: '07:40', prot: 8, kcal: '345' },
        { nom: 'Cantine : poulet, riz, légumes', heure: '12:30', prot: 38, kcal: '700' },
        { nom: 'Shaker protéine, 30 g', heure: '16:15', prot: 24, kcal: '115' },
        { nom: 'Banane', heure: '16:15', prot: 1, kcal: '105' }
      ]
    };
  }
}
</script>
</body>
</html>

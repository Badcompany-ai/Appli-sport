<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>B — Aujourd'hui</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FF5A1F}a:hover{color:#FF7A47}
input[type=range]{accent-color:#FF5A1F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #F2F0EA; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #262626; padding-bottom: 10px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 52px; font-weight: 800; line-height: 0.9; text-transform: uppercase">Aujourd'hui</h1>
      <span style="font-size: 12px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em; padding-bottom: 4px">Lun. 28.12</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #262626">
      <sc-for list="{{ lieux }}" as="l" hint-placeholder-count="3">
        <button onClick="{{ l.pick }}" style="{{ l.style }}">{{ l.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12px; font-weight: 600; color: #FF5A1F; text-transform: uppercase; letter-spacing: 0.12em">Séance A · Reprise S1</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 44px; font-weight: 800; line-height: 0.95; text-transform: uppercase">Explosivité et force bas du corps</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #262626; border-bottom: 1px solid #262626">
        <div style="padding: 10px 0; display: flex; flex-direction: column; border-right: 1px solid #262626">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 800; line-height: 1">{{ duree }}</span>
          <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Minutes</span>
        </div>
        <div style="padding: 10px 0 10px 16px; display: flex; flex-direction: column">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 48px; font-weight: 800; line-height: 1">{{ nbEx }}</span>
          <span style="font-size: 11px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.12em">Exercices</span>
        </div>
      </div>
      <sc-if value="{{ modifie }}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 13px; font-weight: 600; color: #FF5A1F">{{ modifTexte }}</span>
      </sc-if>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: #8A877F; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em">
        <span>Temps disponible · {{ temps }} min</span>
        <input type="range" min="20" max="90" step="5" value="{{ temps }}" onChange="{{ onTemps }}" style="width: 100%">
      </label>
      <a href="B-Seance.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 20px; border-radius: 4px; background: #F2F0EA; color: #0B0B0B; font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 800; text-transform: uppercase; text-decoration: none">Commencer
        <svg width="28" height="28" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.5px; stroke-linecap: square"><line x1="4" y1="14" x2="23" y2="14"></line><polyline points="15,6 23,14 15,22"></polyline></svg></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #262626; padding-top: 12px; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; line-height: 1">1/4</span>
        <div style="height: 4px; background: #262626"><div style="width: 25%; height: 4px; background: #FF5A1F"></div></div>
        <span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Séances</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; line-height: 1">96 g</span>
        <div style="height: 4px; background: #262626"><div style="width: 59%; height: 4px; background: #F2F0EA"></div></div>
        <span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Protéines / 164</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; line-height: 1">1 420</span>
        <div style="height: 4px; background: #262626"><div style="width: 53%; height: 4px; background: #F2F0EA"></div></div>
        <span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Kcal / 2 680</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #262626; padding-top: 12px">
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 10px; font-weight: 600; color: #8A877F; text-transform: uppercase; letter-spacing: 0.1em">Poids · tendance 7 j</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 800; line-height: 1">82,1 kg</span>
      </div>
      <button style="height: 44px; padding: 0 18px; border-radius: 4px; border: 1px solid #F2F0EA; background: transparent; color: #F2F0EA; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase">Peser</button>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: #0B0B0B; border-top: 1px solid #262626; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 10px; box-sizing: border-box">
    <a href="B-Aujourdhui.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #F2F0EA; text-decoration: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><rect x="3" y="3" width="16" height="16"></rect><rect x="8" y="8" width="6" height="6" style="fill: currentColor"></rect></svg>Jour</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><rect x="3" y="4" width="16" height="15"></rect><line x1="3" y1="9" x2="19" y2="9"></line></svg>Programme</span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><line x1="5" y1="19" x2="5" y2="12"></line><line x1="11" y1="19" x2="11" y2="7"></line><line x1="17" y1="19" x2="17" y2="3"></line></svg>Progrès</span>
    <a href="B-Nutrition.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; text-decoration: none; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><circle cx="11" cy="12" r="7"></circle><line x1="11" y1="5" x2="11" y2="2"></line></svg>Nutrition</a>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 5px; color: #6B6862; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em">
      <svg width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2px"><circle cx="11" cy="7" r="4"></circle><path d="M3 20c1-4 4-6 8-6s7 2 8 6"></path></svg>Profil</span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lieu: 'salle', temps: 60 }; }
  renderVals() {
    var self = this;
    var lieu = this.state.lieu;
    var t = this.state.temps;
    var base = 'height: 46px; border: none; font-family: Barlow Condensed, sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; ';
    var lieux = [['salle', 'Salle'], ['maison', 'Maison'], ['dehors', 'Dehors']].map(function (p) {
      var on = p[0] === lieu;
      return { label: p[1], pick: function () { self.setState({ lieu: p[0] }); },
        style: base + (on ? 'background: #FF5A1F; color: #0B0B0B' : 'background: transparent; color: #8A877F') };
    });
    var nb = t >= 60 ? 6 : t >= 45 ? 5 : t >= 35 ? 4 : 3;
    var modifs = { salle: '', maison: '3 exercices remplacés · Voir pourquoi', dehors: '2 exercices remplacés · Voir pourquoi' }[lieu];
    if (t < 60) { modifs = (modifs ? modifs + ' · ' : '') + (6 - nb) + ' retiré' + (6 - nb > 1 ? 's' : '') + ' (temps)'; }
    return {
      lieux: lieux, temps: t, duree: Math.min(58, t), nbEx: nb,
      modifie: !!modifs, modifTexte: modifs,
      onTemps: function (e) { self.setState({ temps: Number(e.target.value) }); }
    };
  }
}
</script>
</body>
</html>

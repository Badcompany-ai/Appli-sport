<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>A — Mode séance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; padding: 52px 20px 34px 20px; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Quitter la séance" style="width: 44px; height: 44px; border-radius: 22px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; color: #F5F5F7">
      <svg width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2px; stroke-linecap: round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></a>
    <span style="font-size: 15px; font-weight: 600; color: #98989F">Exercice 2 sur 6 · 14:32</span>
    <button aria-label="Options de l'exercice" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #1C1C1E; color: #F5F5F7; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" aria-hidden="true" style="fill: currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg></button>
  </div>

  <div style="height: 4px; border-radius: 2px; background: #1C1C1E"><div style="width: 25%; height: 4px; border-radius: 2px; background: #D4FF3A"></div></div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em">Squat arrière</h1>
    <div style="display: flex; gap: 8px; align-items: center">
      <span style="font-size: 15px; font-weight: 600; color: #98989F">Série 2 sur 4</span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #D4FF3A"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #D4FF3A"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #3A3A3C"></span>
      <span style="width: 10px; height: 10px; border-radius: 5px; background: #3A3A3C"></span>
    </div>
  </div>

  <div style="background: #141416; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #98989F">CHARGE</span>
        <span style="font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">{{ charge }}</span>
        <span style="font-size: 15px; font-weight: 600; color: #98989F">kg</span>
        <div style="display: flex; gap: 8px">
          <button onClick="{{ moinsC }}" aria-label="Moins 2,5 kg" style="width: 52px; height: 44px; border-radius: 14px; border: none; background: #2C2C2E; color: #F5F5F7; font-size: 22px; font-weight: 700">−</button>
          <button onClick="{{ plusC }}" aria-label="Plus 2,5 kg" style="width: 52px; height: 44px; border-radius: 14px; border: none; background: #2C2C2E; color: #F5F5F7; font-size: 22px; font-weight: 700">+</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <span style="font-size: 13px; font-weight: 600; color: #98989F">RÉPÉTITIONS</span>
        <span style="font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">{{ reps }}</span>
        <span style="font-size: 15px; font-weight: 600; color: #98989F">objectif 5</span>
        <div style="display: flex; gap: 8px">
          <button onClick="{{ moinsR }}" aria-label="Une répétition de moins" style="width: 52px; height: 44px; border-radius: 14px; border: none; background: #2C2C2E; color: #F5F5F7; font-size: 22px; font-weight: 700">−</button>
          <button onClick="{{ plusR }}" aria-label="Une répétition de plus" style="width: 52px; height: 44px; border-radius: 14px; border: none; background: #2C2C2E; color: #F5F5F7; font-size: 22px; font-weight: 700">+</button>
        </div>
      </div>
    </div>
    <div style="border-top: 1px solid #2C2C2E; padding-top: 14px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; font-weight: 600; color: #98989F">Dernière fois · il y a 5 jours</span>
      <span style="font-size: 17px; font-weight: 700">77,5 kg × 5 · 5 · 5</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <button style="height: 48px; border-radius: 14px; border: none; background: #1C1C1E; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">Remplacer</button>
    <button style="height: 48px; border-radius: 14px; border: none; background: #1C1C1E; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">Fiche</button>
    <button style="height: 48px; border-radius: 14px; border: none; background: #1C1C1E; color: #F5F5F7; font-family: Inter, system-ui, sans-serif; font-size: 14px; font-weight: 600">Note</button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="A-Repos.dc.html" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 20px; background: #D4FF3A; color: #000000; font-size: 20px; font-weight: 800; text-decoration: none">Valider la série</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { charge: 80, reps: 5 }; }
  renderVals() {
    var self = this;
    var c = this.state.charge, r = this.state.reps;
    return {
      charge: String(c).replace('.', ','), reps: r,
      plusC: function () { self.setState({ charge: c + 2.5 }); },
      moinsC: function () { self.setState({ charge: Math.max(0, c - 2.5) }); },
      plusR: function () { self.setState({ reps: r + 1 }); },
      moinsR: function () { self.setState({ reps: Math.max(0, r - 1) }); }
    };
  }
}
</script>
</body>
</html>
